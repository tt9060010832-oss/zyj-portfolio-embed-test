services:
  - type: web
    name: zyj-portfolio-embed-test
    runtime: static
    buildCommand: echo Static site ready
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
